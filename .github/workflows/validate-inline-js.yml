name: Validate inline JavaScript

on:
  push:
    branches:
      - main
      - feature/firebase-auth-foundation
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extract and validate inline scripts
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, flags=re.IGNORECASE)
          scripts = [body for attrs, body in matches if not re.search(r"\bsrc\s*=", attrs, flags=re.IGNORECASE) and body.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript scripts were found.")
          for index, script in enumerate(scripts, start=1):
              Path(f"/tmp/ruta-inline-{index}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s).")
          PY
          for file in /tmp/ruta-inline-*.js; do
            node --check "$file"
          done
